name: NFL card-rule regression (synthetic)

on:
  pull_request:
    paths:
      - 'engine/run_nfl.py'
      - 'engine/run_nfl_wpl.py'
      - 'engine/nfl_wpl.py'
      - 'engine/nfl_wpl_capture.py'
      - 'engine/nfl_provenance.py'
      - 'engine/test_run_nfl.py'
      - 'engine/test_run_nfl_stars.py'
      - 'engine/test_run_nfl_artifacts.py'
      - 'engine/test_run_nfl_isolation.py'
      - 'engine/test_nfl_wpl.py'
      - 'engine/test_nfl_wpl_capture.py'
      - 'engine/test_run_nfl_wpl_cli.py'
      - 'engine/test_run_nfl_wpl_validate.py'
      - 'engine/test_nfl_provenance.py'
      - 'engine/sportsedge_v5.py'
      - '.github/workflows/nfl-run-it-guards.yml'
      - 'docs/governance/changes/pr-*.json'
  push:
    branches: [main, 'perplexity/nfl-wpl-probs-20261126']
    paths:
      - 'engine/run_nfl.py'
      - 'engine/run_nfl_wpl.py'
      - 'engine/nfl_wpl.py'
      - 'engine/nfl_wpl_capture.py'
      - 'engine/nfl_provenance.py'
      - 'engine/test_run_nfl.py'
      - 'engine/test_run_nfl_stars.py'
      - 'engine/test_run_nfl_artifacts.py'
      - 'engine/test_run_nfl_isolation.py'
      - 'engine/test_nfl_wpl.py'
      - 'engine/test_nfl_wpl_capture.py'
      - 'engine/test_run_nfl_wpl_cli.py'
      - 'engine/test_run_nfl_wpl_validate.py'
      - 'engine/test_nfl_provenance.py'
      - 'engine/sportsedge_v5.py'
      - '.github/workflows/nfl-run-it-guards.yml'

permissions:
  contents: read

jobs:
  card-rules:
    name: 30/70 blend, hold, push and card-row guards
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          # PR jobs test the PR HEAD, not GitHub's synthetic merge ref.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned test dependency
        run: python -m pip install numpy==2.5.3
      - name: Check NFL wrapper and card tests compile
        run: python -m py_compile engine/run_nfl.py engine/run_nfl_wpl.py engine/nfl_wpl.py engine/nfl_wpl_capture.py engine/nfl_provenance.py engine/test_run_nfl.py engine/test_run_nfl_stars.py engine/test_run_nfl_artifacts.py engine/test_run_nfl_isolation.py engine/test_nfl_wpl.py engine/test_nfl_wpl_capture.py engine/test_run_nfl_wpl_cli.py engine/test_run_nfl_wpl_validate.py engine/test_nfl_provenance.py
      - name: Run full card-rule regression suite
        run: python -m unittest -v engine.test_run_nfl engine.test_run_nfl_stars engine.test_run_nfl_artifacts engine.test_run_nfl_isolation engine.test_nfl_wpl engine.test_nfl_wpl_capture engine.test_run_nfl_wpl_cli engine.test_run_nfl_wpl_validate engine.test_nfl_provenance
