name: NFL card-rule regression (synthetic)

on:
  pull_request:
    paths:
      - 'engine/run_nfl.py'
      - 'engine/test_run_nfl.py'
      - 'engine/sportsedge_v5.py'
      - '.github/workflows/nfl-run-it-guards.yml'
      - 'docs/governance/changes/pr-472.json'
  push:
    branches: [main]
    paths:
      - 'engine/run_nfl.py'
      - 'engine/test_run_nfl.py'
      - 'engine/sportsedge_v5.py'
      - '.github/workflows/nfl-run-it-guards.yml'

permissions:
  contents: read

jobs:
  card-rules:
    name: 30/70 blend, hold, push and card-row guards
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # PR jobs test the PR HEAD, not GitHub's synthetic merge ref.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned test dependency
        run: python -m pip install numpy==2.5.3
      - name: Check NFL wrapper and card tests compile
        run: python -m py_compile engine/run_nfl.py engine/test_run_nfl.py
      - name: Run full card-rule regression suite
        run: python -m unittest -v engine.test_run_nfl
