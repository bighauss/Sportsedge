name: Daily ratings capture (Torvik CBB + CFBD SP+, encrypted, PAPER)

on:
  workflow_dispatch:   # manual-only until a week of clean runs

permissions:
  contents: read

concurrency:
  group: daily-ratings-capture
  cancel-in-progress: false

jobs:
  capture:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
      SPORTSEDGE_ARCHIVE_FERNET_KEY: ${{ secrets.SPORTSEDGE_ARCHIVE_FERNET_KEY }}
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned encryption package
        run: python -m pip install --disable-pip-version-check cryptography==46.0.4
      - name: Validate archive key before any request
        run: python -c "import os; from cryptography.fernet import Fernet; Fernet(os.environ['SPORTSEDGE_ARCHIVE_FERNET_KEY'].encode()); print('archive key OK')"
      - name: Offline regression tests
        run: python -m unittest sportsedge.validation.test_daily_ratings_capture -v
      - name: Capture (one Torvik GET, one CFBD call)
        id: cap
        continue-on-error: true
        run: |
          umask 077
          python -m sportsedge.validation.daily_ratings_capture "$RUNNER_TEMP/ratings-private"
      - name: Encrypt archive
        if: always()
        run: |
          umask 077
          install -d -m 0700 "$RUNNER_TEMP/ratings-encrypted"
          python - <<'PY'
          import hashlib, json, os, pathlib
          from cryptography.fernet import Fernet
          f = Fernet(os.environ["SPORTSEDGE_ARCHIVE_FERNET_KEY"].encode())
          src = pathlib.Path(os.environ["RUNNER_TEMP"]) / "ratings-private"
          dst = pathlib.Path(os.environ["RUNNER_TEMP"]) / "ratings-encrypted"
          idx = []
          for p in sorted(src.glob("*")) if src.exists() else []:
              b = p.read_bytes(); (dst / (p.name + ".fernet")).write_bytes(f.encrypt(b))
              idx.append({"file": p.name, "plaintext_sha256": "sha256:" + hashlib.sha256(b).hexdigest()})
          (dst / "index.json").write_text(json.dumps(idx, indent=2) + "\n")
          print("encrypted", len(idx), "file(s)")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daily-ratings-encrypted-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ratings-encrypted
          retention-days: 90
          if-no-files-found: ignore
      - name: Report partial capture
        if: steps.cap.outcome == 'failure'
        run: echo "::warning::One or more sources BLOCKED; see the public log line above (states only)" ; exit 1
