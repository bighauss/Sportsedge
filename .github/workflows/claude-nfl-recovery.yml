name: Recovered Claude NFL research source tests
on:
  pull_request:
    paths:
      - 'research/claude_nfl_20261114/**'
      - '.github/workflows/claude-nfl-recovery.yml'
  push:
    branches: [main]
    paths:
      - 'research/claude_nfl_20261114/**'
      - '.github/workflows/claude-nfl-recovery.yml'
permissions:
  contents: read
jobs:
  source-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m compileall -q research/claude_nfl_20261114
      - run: python research/claude_nfl_20261114/test_recovery.py
