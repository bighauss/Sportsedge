name: MLB PGA public historical source acquisition
on:
  push:
    branches: [research/mlb-pga-public-source-acquisition-20261124]
    paths: ['.github/workflows/mlb-pga-public-source-acquisition.yml']
  pull_request:
    paths: ['.github/workflows/mlb-pga-public-source-acquisition.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mlb:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Fetch regular-season game logs
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/mlb-source"
          cd "$RUNNER_TEMP/mlb-source"
          for season in 2019 2021 2022 2023 2024 2025; do
            url="https://raw.githubusercontent.com/chadwickbureau/retrosheet/master/seasons/${season}/GL${season}.TXT"
            curl --fail --location --silent --show-error --retry 2 --max-time 120 "$url" -o "GL${season}.TXT"
            printf '%s\t%s\n' "GL${season}.TXT" "$url" >> sources.tsv
          done
          cat > ATTRIBUTION.txt <<'EOF'
          The information used here was obtained free of
          charge from and is copyrighted by Retrosheet. Interested
          parties may contact Retrosheet at 20 Sunset Rd.,
          Newark, DE 19711.
          Source mirror: Chadwick Baseball Bureau, https://github.com/chadwickbureau/retrosheet
          EOF
          python - <<'PY'
          import csv, json, hashlib, pathlib, datetime
          files=[]
          for line in pathlib.Path('sources.tsv').read_text().splitlines():
              name,url=line.split('\t')
              p=pathlib.Path(name); raw=p.read_bytes()
              with p.open(newline='',encoding='utf-8-sig') as f:
                  rows=list(csv.reader(f))
              season=name[2:6]
              if not 2000<=len(rows)<=2500 or any(len(r)!=161 or not r[0].startswith(season) or not r[9].isdigit() or not r[10].isdigit() for r in rows):
                  raise ValueError('UNEXPECTED_GAME_LOG_SCHEMA_OR_COUNT:'+name)
              files.append(dict(file=name,url=url,sha256=hashlib.sha256(raw).hexdigest(),bytes=len(raw),rows=len(rows)))
          report=dict(source='Chadwick mirror of Retrosheet',observed_utc=datetime.datetime.now(datetime.timezone.utc).isoformat(),files=files,limits='Historical reconstructed game logs, not contemporaneous pregame evidence.')
          pathlib.Path('manifest.json').write_text(json.dumps(report,indent=2))
          print(json.dumps(report))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: mlb-retrosheet-research-source
          path: ${{ runner.temp }}/mlb-source/
          retention-days: 14
          if-no-files-found: error
  pga:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch completed 2025 leaderboard and schedule
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/pga-source"
          cd "$RUNNER_TEMP/pga-source"
          curl --fail --location --silent --show-error --retry 2 --max-time 120 'https://github.com/array-carpenter/golfastr/releases/download/leaderboards/leaderboards_2025.csv' -o leaderboards_2025.csv
          curl --fail --location --silent --show-error --retry 2 --max-time 120 'https://github.com/array-carpenter/golfastr/releases/download/schedules/schedule_2025.csv' -o schedule_2025.csv
          printf '%s\n' '23aff7773156cf90cf971d9cfe70216add0750528ec2cf81605889858c7839d0  leaderboards_2025.csv' 'cc3e6fb290dccabf6bd8f970f8e0c6c77c112e506638cc2439dedac519c09729  schedule_2025.csv' | sha256sum -c -
          printf '%s\n' 'GolfastR, Ray Carpenter; underlying leaderboard and schedule data: ESPN. Research only; data rights are distinct from package code license.' > ATTRIBUTION.txt
          python - <<'PY'
          import csv,json,hashlib,pathlib,datetime
          urls={'leaderboards_2025.csv':'https://github.com/array-carpenter/golfastr/releases/download/leaderboards/leaderboards_2025.csv','schedule_2025.csv':'https://github.com/array-carpenter/golfastr/releases/download/schedules/schedule_2025.csv'}
          files=[]
          for name,url in urls.items():
              p=pathlib.Path(name);raw=p.read_bytes()
              with p.open(newline='',encoding='utf-8-sig') as f:
                  r=csv.DictReader(f);n=sum(1 for _ in r)
                  if not r.fieldnames or n<1:raise ValueError('EMPTY_CSV')
              files.append(dict(file=name,url=url,sha256=hashlib.sha256(raw).hexdigest(),bytes=len(raw),rows=n,columns=r.fieldnames))
          report=dict(observed_utc=datetime.datetime.now(datetime.timezone.utc).isoformat(),source='GolfastR/ESPN',files=files,limits='Single completed season; not independently authenticated pre-event snapshots. No claim of strokes-gained coverage.')
          pathlib.Path('manifest.json').write_text(json.dumps(report,indent=2))
          print(json.dumps(report))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: pga-golfastr-2025-research-source
          path: ${{ runner.temp }}/pga-source/
          retention-days: 14
          if-no-files-found: error
