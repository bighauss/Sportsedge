name: Authorized API secret presence preflight (no network)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  secret-presence:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check configured secret names without exposing values
        env:
          CFBD_PRESENT: ${{ secrets.CFBD_API_KEY != '' }}
          CFBD_BACKUP_PRESENT: ${{ secrets.CFBD_API_KEY_BACKUP != '' }}
          ODDS_PRESENT: ${{ secrets.ODDS_API_KEY != '' }}
          ODDS_BACKUP_PRESENT: ${{ secrets.ODDS_API_KEY_BACKUP != '' }}
          API_SPORTS_PRESENT: ${{ secrets.API_SPORTS_KEY != '' }}
        run: |
          python3 - <<'PY'
          import os
          names = ('CFBD_PRESENT','CFBD_BACKUP_PRESENT','ODDS_PRESENT','ODDS_BACKUP_PRESENT','API_SPORTS_PRESENT')
          for name in names:
              state = 'configured' if os.environ[name] == 'true' else 'missing'
              print(f'{name}: {state}')
          required = ('CFBD_PRESENT','ODDS_PRESENT','API_SPORTS_PRESENT')
          if any(os.environ[name] != 'true' for name in required):
              raise SystemExit('Required API secret names not configured; no provider requests attempted')
          print('Secret-name preflight passed. Authentication, permissions, data provenance and Gate A remain UNVERIFIED.')
          PY
