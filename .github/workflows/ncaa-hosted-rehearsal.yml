name: NCAA provider-free artifact rehearsal
on:
  workflow_dispatch:
  pull_request:
    types: [labeled]

permissions:
  contents: read
  actions: read

jobs:
  inject:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.number == 405 && github.event.label.name == 'rehearse-ncaa-405' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        fault: [capture, export, marker]
    env:
      SCOPE: rehearsal-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.fault }}
      GH_ACTIONS_READ_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Reserve synthetic slot
        id: claim
        run: python -m sportsedge.odds.daily_pilot_artifact_gate reserve --pilot "$SCOPE-ncaab-pregame"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.claim.outputs.artifact_name }}
          path: ${{ runner.temp }}/${{ env.SCOPE }}-ncaab-pregame-daily-claim.json
          if-no-files-found: error
      - name: Verify claim ownership
        run: python -m sportsedge.odds.daily_pilot_artifact_gate verify --pilot "$SCOPE-ncaab-pregame"
      - name: Synthetic capture
        id: capture
        env:
          FAULT: ${{ matrix.fault }}
        run: |
          mkdir "$RUNNER_TEMP/fixture"
          printf 'synthetic\n' > "$RUNNER_TEMP/fixture/input"
          test "$FAULT" != capture
      - name: Exercise export failure on synthetic input
        id: export
        if: success()
        run: |
          python -m pip install cryptography==46.0.4
          python - <<'PY'
          from pathlib import Path
          from cryptography.fernet import Fernet
          import os
          from sportsedge.odds.ncaa_archive_export import export
          root = Path(os.environ["RUNNER_TEMP"])
          target = root / "already-exists"
          target.write_bytes(b"synthetic prior archive")
          export(root / "fixture", target, Fernet(Fernet.generate_key()))
          PY
      - name: Persist shared stop signal
        if: always() && steps.capture.outcome != 'skipped' && (steps.capture.outcome != 'success' || steps.export.outcome != 'success')
        uses: ./.github/actions/ncaa-hold
        with:
          # A slash is rejected by the real artifact service/action for the marker fault.
          artifact-name: ${{ env.SCOPE }}-ncaa-daily-odds-quota-hold${{ matrix.fault == 'marker' && '/invalid' || '' }}

  verify:
    needs: inject
    if: always() && needs.inject.result == 'failure'
    runs-on: ubuntu-latest
    env:
      GH_ACTIONS_READ_TOKEN: ${{ github.token }}
      SCOPE: rehearsal-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Inspect remote hold and claim metadata from a fresh runner
        run: |
          python - <<'PY'
          import os
          from sportsedge.odds.daily_pilot_artifact_gate import Blocked, api_artifacts, reserve
          env = os.environ
          repo, token = env["GITHUB_REPOSITORY"], env["GH_ACTIONS_READ_TOKEN"]
          for fault in ("capture", "export", "marker"):
              prefix = env["SCOPE"] + "-" + fault
              name = prefix + "-ncaa-daily-odds-quota-hold"
              rows = api_artifacts(repo, token, name)["artifacts"]
              if fault == "marker":
                  assert not rows, "unexpected durable marker"
                  continue
              assert len(rows) == 1 and not rows[0]["expired"]
              assert str(rows[0]["workflow_run"]["id"]) == env["GITHUB_RUN_ID"]
              try:
                  reserve(env["RUNNER_TEMP"], repository=repo, run_id=env["GITHUB_RUN_ID"],
                          token=token, pilot=prefix + "-ncaaf-close")
              except Blocked as exc:
                  assert str(exc) == "PILOT_QUOTA_HOLD_REVIEW_REQUIRED", str(exc)
              else:
                  raise AssertionError("fresh slot admitted after hold")
          print("Both durable holds blocked cross-sport fresh-runner admission; failed marker absent.")
          PY
