name: CFB RUN IT (manual)

# Phone-triggered: Actions -> CFB RUN IT -> Run workflow.
# capture (CFBD + Open-Meteo) -> unmodified models/cfb/sportsedge_cfb_model.py -> ranked card.
# Fails closed on missing key / injury intake. Raw captures are Fernet-encrypted before upload;
# only the sanitized card (no keys, no raw captures) goes to the job summary and the issue comment.
on:
  workflow_dispatch:
    inputs:
      lines_path:
        description: "Line intake JSON in repo"
        default: "models/cfb/lines/2026-11-21_dk.json"
      season:
        description: "CFB season"
        default: "2026"
      allow_no_injury_feed:
        description: "Run without an injury list (card says 'injuries: none supplied')"
        type: boolean
        default: false
      issue:
        description: "Issue number to post the card to (blank = summary only)"
        required: false
        default: ""

permissions:
  contents: read
  issues: write

concurrency:
  group: cfb-run-it
  cancel-in-progress: false

jobs:
  run-it:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install provider-free evidence-test dependency
        run: python -m pip install -q --disable-pip-version-check cryptography==46.0.4
      - name: Offline end-to-end gate (fixture capture -> model -> card -> evidence)
        run: python -m unittest models.cfb.test_cfb_run_it models.cfb.test_cfb_run_it_inputs models.cfb.test_cfb_run_it_p0 models.cfb.test_cfb_run_it_evidence -v
      - name: Encryption preflight (fail closed before any provider request)
        env:
          SPORTSEDGE_ARCHIVE_FERNET_KEY: ${{ secrets.SPORTSEDGE_ARCHIVE_FERNET_KEY }}
        run: |
          [ -n "$SPORTSEDGE_ARCHIVE_FERNET_KEY" ] || { echo "::error::archive key not configured"; exit 2; }
          python -c "import os; from cryptography.fernet import Fernet; Fernet(os.environ['SPORTSEDGE_ARCHIVE_FERNET_KEY'].encode()); print('archive key OK')"
      - name: Live run
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
          LINES: ${{ inputs.lines_path }}
          SEASON: ${{ inputs.season }}
          NOINJ: ${{ inputs.allow_no_injury_feed }}
        run: |
          umask 077
          flag=""; [ "$NOINJ" = "true" ] && flag="--allow-no-injury-feed"
          install -d -m 0700 "$RUNNER_TEMP/private"
          python models/cfb/cfb_run_it.py "$LINES" --season "$SEASON" --out out \
            --private-dir "$RUNNER_TEMP/private" $flag \
            > "$RUNNER_TEMP/private/stdout.log" 2> "$RUNNER_TEMP/private/stderr.log"
      - name: Encrypt private capture and verify against public receipts
        id: encrypt
        if: ${{ success() }}
        env:
          SPORTSEDGE_ARCHIVE_FERNET_KEY: ${{ secrets.SPORTSEDGE_ARCHIVE_FERNET_KEY }}
        run: |
          python - <<'PY'
          import hashlib, json, os, pathlib
          from cryptography.fernet import Fernet
          f = Fernet(os.environ["SPORTSEDGE_ARCHIVE_FERNET_KEY"].encode())
          src = pathlib.Path(os.environ["RUNNER_TEMP"]) / "private"
          dst = pathlib.Path(os.environ["RUNNER_TEMP"]) / "private-enc"; dst.mkdir(mode=0o700)
          receipt_rows = json.load(open("out/receipts.json"))
          want = {r["source"]: r["sha256"] for r in receipt_rows}
          if not want or len(want) != len(receipt_rows):
              raise SystemExit("BLOCK_MISSING_OR_DUPLICATE_SOURCE_RECEIPTS")
          actual = {p.stem for p in src.glob("*.json") if p.is_file() and not p.is_symlink()}
          if actual != set(want):
              raise SystemExit("BLOCK_CAPTURE_RECEIPT_CENSUS_MISMATCH")
          for name, digest in want.items():
              p = src / f"{name}.json"
              enc = f.encrypt(p.read_bytes())
              if hashlib.sha256(f.decrypt(enc)).hexdigest() != digest:
                  raise SystemExit(f"RECEIPT_HASH_MISMATCH {name}")
              (dst / (p.name + ".fernet")).write_bytes(enc); p.unlink()
          print("verified", len(want), "sources")
          PY
      - name: Freeze recheck immediately before publication
        run: python models/cfb/cfb_run_it.py --recheck --out out
      - name: Seal the final rechecked card and private logs
        id: seal
        if: ${{ success() && steps.encrypt.outcome == 'success' }}
        env:
          SPORTSEDGE_ARCHIVE_FERNET_KEY: ${{ secrets.SPORTSEDGE_ARCHIVE_FERNET_KEY }}
        run: |
          python - <<'PY'
          import datetime as dt, hashlib, json, os, pathlib
          from cryptography.fernet import Fernet
          root = pathlib.Path(os.environ["RUNNER_TEMP"])
          src, dst = root / "private", root / "private-enc"
          cipher = Fernet(os.environ["SPORTSEDGE_ARCHIVE_FERNET_KEY"].encode())
          doc = json.loads(pathlib.Path("out/cfb_run_it.json").read_bytes())
          card = doc["card"]
          if card["eligibility"]["state"] != "RESEARCH_ONLY" or card["eligibility"]["approved_stake_u"] != 0:
              raise SystemExit("BLOCK_NON_RESEARCH_CARD")
          if not card.get("rechecked_utc"):
              raise SystemExit("BLOCK_MISSING_PUBLICATION_FREEZE")
          when = dt.datetime.fromisoformat(card["rechecked_utc"])
          if any(dt.datetime.fromisoformat(r["kickoff_utc"]) <= when for r in card["rows"]):
              raise SystemExit("BLOCK_POST_KICKOFF_ROW")
          if doc["card"]["receipts"] != json.loads(pathlib.Path("out/receipts.json").read_bytes()):
              raise SystemExit("BLOCK_CARD_RECEIPTS_DISAGREE")
          for name, src_path in {
              "cfb_run_it.json": pathlib.Path("out/cfb_run_it.json"),
              "cfb_card.md": pathlib.Path("out/cfb_card.md"),
              "receipts.json": pathlib.Path("out/receipts.json"),
              "stdout.log": src / "stdout.log",
              "stderr.log": src / "stderr.log",
          }.items():
              data = src_path.read_bytes()
              sealed = cipher.encrypt(data)
              if hashlib.sha256(cipher.decrypt(sealed)).digest() != hashlib.sha256(data).digest():
                  raise SystemExit("BLOCK_SEAL_ROUNDTRIP:" + name)
              (dst / (name + ".fernet")).write_bytes(sealed)
          PY
      - name: Retain encrypted source evidence
        id: evidence
        if: ${{ success() && steps.seal.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: cfb-run-it-private-encrypted-${{ github.run_id }}
          path: ${{ runner.temp }}/private-enc
          retention-days: 90
          if-no-files-found: error
      - name: Publish card after verified evidence retention
        if: ${{ success() && steps.evidence.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ inputs.issue }}
        run: |
          cat out/cfb_card.md >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$ISSUE" ]; then gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body-file out/cfb_card.md; fi
