name: CFB RUN IT (manual)

# Phone-triggered: Actions -> CFB RUN IT -> Run workflow.
# capture (CFBD + Open-Meteo) -> unmodified models/cfb/sportsedge_cfb_model.py -> ranked card.
# Fails closed on missing key / injury intake. Raw captures are Fernet-encrypted before upload;
# only the sanitized card (no keys, no raw captures) goes to the job summary and the issue comment.
on:
  workflow_dispatch:
    inputs:
      lines_path:
        description: "Line intake JSON in repo"
        default: "models/cfb/lines/2026-11-21_dk.json"
      season:
        description: "CFB season"
        default: "2026"
      allow_no_injury_feed:
        description: "Run without an injury list (card says 'injuries: none supplied')"
        type: boolean
        default: false
      issue:
        description: "Issue number to post the card to (blank = summary only)"
        required: false
        default: ""

permissions:
  contents: read
  issues: write
  actions: read

concurrency:
  group: cfb-run-it
  cancel-in-progress: false

jobs:
  run-it:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline end-to-end gate (fixture capture -> model -> card)
        run: python -m unittest models.cfb.test_cfb_run_it models.cfb.test_cfb_run_it_inputs models.cfb.test_cfb_run_it_p0 models.cfb.test_cfb_run_it_ledger -v
      - name: Encryption preflight (fail closed before any provider request)
        env:
          SPORTSEDGE_ARCHIVE_FERNET_KEY: ${{ secrets.SPORTSEDGE_ARCHIVE_FERNET_KEY }}
        run: |
          [ -n "$SPORTSEDGE_ARCHIVE_FERNET_KEY" ] || { echo "::error::archive key not configured"; exit 2; }
          python -m pip install -q --disable-pip-version-check cryptography==46.0.4
          python -c "import os; from cryptography.fernet import Fernet; Fernet(os.environ['SPORTSEDGE_ARCHIVE_FERNET_KEY'].encode()); print('archive key OK')"
      - name: Restore and verify encrypted paper ledger from the previous run
        env:
          GH_TOKEN: ${{ github.token }}
          SPORTSEDGE_ARCHIVE_FERNET_KEY: ${{ secrets.SPORTSEDGE_ARCHIVE_FERNET_KEY }}
        run: |
          set -euo pipefail
          install -d -m 0700 "$RUNNER_TEMP/ledger"
          id=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=cfb-run-it-ledger&per_page=1" --jq '[.artifacts[]|select(.expired==false)][0].id // empty')
          if [ -z "$id" ]; then echo "no prior ledger artifact: new chain"; exit 0; fi
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" > "$RUNNER_TEMP/ledger.zip"
          unzip -q "$RUNNER_TEMP/ledger.zip" -d "$RUNNER_TEMP/ledger-enc"
          python - <<'PY'
          import os, pathlib
          from cryptography.fernet import Fernet
          from models.cfb import cfb_ledger as LG
          t = pathlib.Path(os.environ['RUNNER_TEMP'])
          raw = Fernet(os.environ['SPORTSEDGE_ARCHIVE_FERNET_KEY'].encode('ascii')).decrypt((t / 'ledger-enc' / 'ledger.jsonl.fernet').read_bytes())
          p = t / 'ledger' / 'ledger.jsonl'
          fd = os.open(p, os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600)
          with os.fdopen(fd, 'wb') as f: f.write(raw)
          print('restored ledger entries:', len(LG.verify(p)))
          PY
      - name: Live run
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
          LINES: ${{ inputs.lines_path }}
          SEASON: ${{ inputs.season }}
          NOINJ: ${{ inputs.allow_no_injury_feed }}
        run: |
          umask 077
          flag=""; [ "$NOINJ" = "true" ] && flag="--allow-no-injury-feed"
          python models/cfb/cfb_run_it.py "$LINES" --season "$SEASON" --out out \
            --private-dir "$RUNNER_TEMP/private" $flag
      - name: Encrypt private capture and verify against public receipts
        id: encrypt
        if: ${{ success() }}
        env:
          SPORTSEDGE_ARCHIVE_FERNET_KEY: ${{ secrets.SPORTSEDGE_ARCHIVE_FERNET_KEY }}
        run: |
          python - <<'PY'
          import hashlib, json, os, pathlib
          from cryptography.fernet import Fernet
          f = Fernet(os.environ["SPORTSEDGE_ARCHIVE_FERNET_KEY"].encode())
          src = pathlib.Path(os.environ["RUNNER_TEMP"]) / "private"
          dst = pathlib.Path(os.environ["RUNNER_TEMP"]) / "private-enc"; dst.mkdir(mode=0o700)
          want = {r["source"]: r["sha256"] for r in json.load(open("out/receipts.json"))}
          if not want:
              raise SystemExit("BLOCK_NO_SOURCE_RECEIPTS")
          for name, digest in want.items():
              p = src / f"{name}.json"
              enc = f.encrypt(p.read_bytes())
              if hashlib.sha256(f.decrypt(enc)).hexdigest() != digest:
                  raise SystemExit(f"RECEIPT_HASH_MISMATCH {name}")
              (dst / (p.name + ".fernet")).write_bytes(enc); p.unlink()
          print("verified", len(want), "sources")
          PY
      - name: Freeze recheck immediately before publication
        run: python models/cfb/cfb_run_it.py --recheck --out out
      - name: Freeze rechecked card into the PAPER ledger (refuses tampered chain / re-frozen game)
        run: python models/cfb/cfb_run_it.py --freeze-ledger "$RUNNER_TEMP/ledger/ledger.jsonl" --out out
      - name: Encrypt ledger for the next run
        env:
          SPORTSEDGE_ARCHIVE_FERNET_KEY: ${{ secrets.SPORTSEDGE_ARCHIVE_FERNET_KEY }}
        run: |
          install -d -m 0700 "$RUNNER_TEMP/ledger-out"
          python - <<'PY'
          import os, pathlib
          from cryptography.fernet import Fernet
          from models.cfb import cfb_ledger as LG
          t = pathlib.Path(os.environ['RUNNER_TEMP'])
          LG.verify(t / 'ledger' / 'ledger.jsonl')
          f = Fernet(os.environ['SPORTSEDGE_ARCHIVE_FERNET_KEY'].encode('ascii'))
          raw = (t / 'ledger' / 'ledger.jsonl').read_bytes(); tok = f.encrypt(raw)
          if f.decrypt(tok) != raw: raise SystemExit('BLOCK_ENCRYPTION_ROUNDTRIP')
          (t / 'ledger-out' / 'ledger.jsonl.fernet').write_bytes(tok)
          PY
      - name: Retain encrypted ledger
        uses: actions/upload-artifact@v4
        with:
          name: cfb-run-it-ledger
          path: ${{ runner.temp }}/ledger-out/ledger.jsonl.fernet
          retention-days: 90
          if-no-files-found: error
      - name: Retain encrypted source evidence
        id: evidence
        if: ${{ success() && steps.encrypt.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: cfb-run-it-private-encrypted-${{ github.run_id }}
          path: ${{ runner.temp }}/private-enc
          retention-days: 90
          if-no-files-found: error
      - name: Publish card after verified evidence retention
        if: ${{ success() && steps.evidence.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ inputs.issue }}
        run: |
          cat out/cfb_card.md >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$ISSUE" ]; then gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body-file out/cfb_card.md; fi
