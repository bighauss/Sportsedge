name: Authorized provider authentication smoke test
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  provider-auth:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      API_SPORTS_KEY: ${{ secrets.API_SPORTS_KEY }}
    steps:
      - name: Test read-only provider authentication (no response bodies)
        shell: python
        run: |
          import os, urllib.request, urllib.error, json, sys, socket
          providers = [
              ("CFBD", "https://api.collegefootballdata.com/games?year=2025&week=1", {"Authorization": "Bearer " + os.environ.get("CFBD_API_KEY", "")}, "CFBD_API_KEY"),
              ("The Odds API", "https://api.the-odds-api.com/v4/sports?apiKey=" + os.environ.get("ODDS_API_KEY", ""), {}, "ODDS_API_KEY"),
              ("API-Sports Football", "https://v3.football.api-sports.io/status", {"x-apisports-key": os.environ.get("API_SPORTS_KEY", "")}, "API_SPORTS_KEY"),
          ]
          failed = False
          for name, url, headers, key_name in providers:
              if not os.environ.get(key_name):
                  print(f"{name}: MISSING_SECRET")
                  failed = True
                  continue
              request = urllib.request.Request(url, headers={**headers, "User-Agent": "SportsEdge-auth-preflight/1.0", "Accept": "application/json"})
              try:
                  with urllib.request.urlopen(request, timeout=15) as response:
                      status = response.status
                      # Read bounded bytes only; do not print any response or URL.
                      payload = response.read(262144)
                      try:
                          body = json.loads(payload)
                      except (ValueError, UnicodeError):
                          print(f"{name}: INVALID_JSON HTTP_{status}")
                          failed = True
                          continue
                      if name == "API-Sports Football":
                          errors = body.get("errors") if isinstance(body, dict) else None
                          if errors:
                              print(f"{name}: PROVIDER_ERROR HTTP_{status}")
                              failed = True
                              continue
                      print(f"{name}: AUTH_HTTP_{status}_JSON_OK (entitlement and provenance not verified)")
              except urllib.error.HTTPError as exc:
                  print(f"{name}: HTTP_{exc.code} (authentication, quota, or entitlement may be blocked)")
                  failed = True
              except (urllib.error.URLError, TimeoutError, socket.timeout, OSError) as exc:
                  print(f"{name}: NETWORK_OR_TIMEOUT_ERROR ({type(exc).__name__})")
                  failed = True
          print("No odds or predictions certified; all markets remain PAPER/0u.")
          if failed:
              sys.exit(1)
