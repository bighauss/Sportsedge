name: NCAA daily odds snapshot (CBB/CFB, encrypted, PAPER)

on:
  # Manual-only. No schedule: each dispatch is one claimed, budgeted attempt.
  workflow_dispatch:
    inputs:
      sport:
        description: 'ncaab = basketball_ncaab (CBB), ncaaf = americanfootball_ncaaf (CFB)'
        required: true
        type: choice
        options: [ncaab, ncaaf]
      snapshot:
        description: 'pregame = morning pre-freeze quote; close = dispatch within 90 min of start'
        required: true
        type: choice
        options: [pregame, close]

permissions:
  contents: read
  actions: read  # list prior claim/hold artifacts before any provider call

concurrency:
  # Serialize every NCAA run: both sports share one Odds API quota.
  group: ncaa-daily-odds
  cancel-in-progress: false

jobs:
  capture:
    # Secrets never reach pull-request jobs or non-main branches.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      ODDS_API_KEY_BACKUP: ${{ secrets.ODDS_API_KEY_BACKUP }}
      SPORTSEDGE_ARCHIVE_FERNET_KEY: ${{ secrets.SPORTSEDGE_ARCHIVE_FERNET_KEY }}
      NCAA_SPORT: ${{ inputs.sport }}
      NCAA_SNAPSHOT: ${{ inputs.snapshot }}
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fail closed on unexpected inputs or absent owner secrets
        shell: bash
        run: |
          set -euo pipefail
          case "$NCAA_SPORT" in ncaab|ncaaf) ;; *) echo "::error::BLOCK_INPUT_SPORT"; exit 2;; esac
          case "$NCAA_SNAPSHOT" in pregame|close) ;; *) echo "::error::BLOCK_INPUT_SNAPSHOT"; exit 2;; esac
          if [[ -z "${ODDS_API_KEY:-}" && -z "${ODDS_API_KEY_BACKUP:-}" ]]; then
            echo "::error::BLOCK_SOURCE_AUTH: configure ODDS_API_KEY (or ODDS_API_KEY_BACKUP)"
            exit 2
          fi
          if [[ -z "${SPORTSEDGE_ARCHIVE_FERNET_KEY:-}" ]]; then
            echo "::error::BLOCK_ARCHIVE_ENCRYPTION: configure SPORTSEDGE_ARCHIVE_FERNET_KEY"
            exit 2
          fi
      - name: Install pinned encryption package
        run: python -m pip install --disable-pip-version-check cryptography==46.0.4
      - name: Validate Fernet key before any provider call
        shell: bash
        run: |
          python - <<'PY'
          import os, sys
          from cryptography.fernet import Fernet
          try:
              Fernet(os.environ["SPORTSEDGE_ARCHIVE_FERNET_KEY"].encode("ascii"))
          except (KeyError, ValueError, TypeError):
              print("::error::BLOCK_ARCHIVE_ENCRYPTION: invalid Fernet secret", file=sys.stderr)
              sys.exit(2)
          PY
      - name: Offline regression tests
        run: python -m unittest sportsedge.odds.test_ncaa_daily_odds sportsedge.odds.test_daily_pilot_artifact_gate -v
      - name: Check prior claims/holds and reserve sport+snapshot+Central date
        id: daily_claim
        shell: bash
        env:
          GH_ACTIONS_READ_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python -m sportsedge.odds.daily_pilot_artifact_gate reserve --pilot "${NCAA_SPORT}-${NCAA_SNAPSHOT}"
      - name: Persist claim artifact BEFORE any provider request
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.daily_claim.outputs.artifact_name }}
          path: ${{ runner.temp }}/${{ inputs.sport }}-${{ inputs.snapshot }}-daily-claim.json
          retention-days: 90
          if-no-files-found: error
      - name: Confirm claim belongs to this run and same Central date
        shell: bash
        env:
          GH_ACTIONS_READ_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python -m sportsedge.odds.daily_pilot_artifact_gate verify --pilot "${NCAA_SPORT}-${NCAA_SNAPSHOT}"
      - name: One budgeted snapshot (free preflight, then at most 3 credits)
        shell: bash
        env:
          PRIVATE_ROOT: ${{ runner.temp }}/sportsedge-private-ncaa-odds
          SPORTSEDGE_DAILY_CLAIM_DATE_CT: ${{ steps.daily_claim.outputs.date_ct }}
        run: |
          set -euo pipefail
          umask 077
          python -m sportsedge.odds.ncaa_daily_odds "$PRIVATE_ROOT" \
            --sport "$NCAA_SPORT" --snapshot "$NCAA_SNAPSHOT" --execute
      - name: Encrypt every archived file (raw response never uploaded in clear)
        if: always()
        shell: bash
        env:
          PRIVATE_ROOT: ${{ runner.temp }}/sportsedge-private-ncaa-odds
          EXPORT_ROOT: ${{ runner.temp }}/sportsedge-encrypted-ncaa-odds
        run: |
          set -euo pipefail
          umask 077
          install -d -m 0700 "$EXPORT_ROOT"
          [[ -d "$PRIVATE_ROOT" ]] || { echo "nothing archived"; exit 0; }
          python - <<'PY'
          import hashlib, json, os, pathlib
          from cryptography.fernet import Fernet
          f = Fernet(os.environ["SPORTSEDGE_ARCHIVE_FERNET_KEY"].encode())
          src = pathlib.Path(os.environ["PRIVATE_ROOT"]); dst = pathlib.Path(os.environ["EXPORT_ROOT"])
          index = []
          for p in sorted(x for x in src.rglob("*") if x.is_file()):
              data = p.read_bytes()
              (dst / (p.name + ".fernet")).write_bytes(f.encrypt(data))
              index.append({"file": p.name, "plaintext_sha256": "sha256:" + hashlib.sha256(data).hexdigest()})
          (dst / "index.json").write_text(json.dumps(index, indent=2) + "\n")
          print(f"encrypted {len(index)} file(s)")
          PY
      - name: Persist shared NCAA quota hold even if capture or encryption failed
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ncaa-daily-odds-quota-hold
          path: ${{ runner.temp }}/sportsedge-private-ncaa-odds/ncaa-daily-odds.quota-hold.json
          retention-days: 90
          if-no-files-found: ignore
      - name: Retain encrypted archive only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ncaa-odds-encrypted-${{ inputs.sport }}-${{ inputs.snapshot }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sportsedge-encrypted-ncaa-odds
          retention-days: 90
          if-no-files-found: ignore
