name: RUN IT v2.2 policy guard (PAPER only)
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  v22-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m py_compile research/risk/v22_policy_guard.py research/risk/test_v22_policy_guard.py
      - run: python research/risk/test_v22_policy_guard.py
