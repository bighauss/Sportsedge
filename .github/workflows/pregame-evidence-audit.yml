name: Pregame evidence audit tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile the read-only audit
        run: python -m compileall -q research/audit
      - name: Run 13 pregame evidence regression tests
        run: python research/audit/test_pregame_edge_audit.py
