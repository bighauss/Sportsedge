name: CFB shared simulation tests
on:
  pull_request:
    paths:
      - 'models/cfb/cfb_shared_sim.py'
      - 'models/cfb/test_cfb_shared_sim.py'
      - '.github/workflows/cfb-shared-sim.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sim:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Shared-draw consistency checks
        working-directory: models/cfb
        run: python -m unittest -v test_cfb_shared_sim
