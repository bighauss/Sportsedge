name: CFB push-aware challenger tests
on:
  pull_request:
    paths:
      - 'models/cfb/cfb_push_challenger.py'
      - 'models/cfb/test_cfb_push_challenger.py'
      - '.github/workflows/cfb-push-challenger.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  challenger:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Push-aware repricing checks (frozen model untouched)
        working-directory: models/cfb
        run: python -m unittest -v test_cfb_push_challenger
