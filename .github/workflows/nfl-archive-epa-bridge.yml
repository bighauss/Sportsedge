name: NFL archived public PBP to point-in-time EPA research tests
on:
  pull_request:
    paths:
      - 'models/nfl/epa_from_public_archive.py'
      - 'models/nfl/test_epa_from_public_archive.py'
      - 'docs/evidence/NFL_PUBLIC_PBP_TO_EPA.md'
      - '.github/workflows/nfl-archive-epa-bridge.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  archived-pbp-to-epa:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Synthetic source archive and chronology adversarial tests
        run: python -m unittest discover -s models/nfl -p 'test_epa_from_public_archive.py' -v
      - name: Compile frozen PBP research archive bridge
        run: python -m py_compile models/nfl/epa_from_public_archive.py
