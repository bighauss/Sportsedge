name: SportsLeader research
on:
  pull_request:
    paths:
      - 'research/sportsleader/**'
      - '.github/workflows/sportsleader-research.yml'
permissions:
  contents: read
jobs:
  fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pyarrow==19.0.1
      - run: python -m unittest discover -s research/sportsleader -p 'test_*.py' -v
