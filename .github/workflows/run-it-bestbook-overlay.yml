name: RUN IT BestBook supplemental research overlay
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  bestbook-run-it:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m py_compile sportsedge/markets/bestbook_slate_overlay.py sportsedge/markets/test_bestbook_slate_overlay.py sportsedge/markets/slate_orchestrator.py
      - run: python -m unittest sportsedge.odds.test_bestbook_public_reference -v
      - run: python -m unittest sportsedge.markets.test_bestbook_slate_overlay -v
      - run: python -m unittest sportsedge.markets.test_slate_orchestrator -v
