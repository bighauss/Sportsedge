name: Observability original-source manifest synthetic
on:
  pull_request:
    paths:
      - 'research/observability/**'
      - '.github/workflows/observability-run-manifest.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest research.observability.test_run_manifest_contract -v
