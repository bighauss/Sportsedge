name: tests
on: [push, pull_request]
jobs:
  models:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax check (stdlib)
        run: python -m compileall -q models sportsedge
      - name: Shared model-market probability guard regression
        working-directory: models/common
        run: python -m unittest -v test_guard_probability_safety.py
      - name: PGA point-in-time market preflight
        working-directory: models/pga
        run: python -m unittest -v test_market_preflight.py test_tournament_sim.py test_snapshot_gate.py test_forward_eval.py test_odds_provider_adapter.py test_live_odds_capture.py test_datagolf_capture.py test_datagolf_receipt_store.py test_datagolf_receipt_guard.py
      - name: MLB
        working-directory: models/mlb
        run: python make_samples.py && python test_sportsedge_mlb_model.py
      - name: NBA
        working-directory: models/nba
        run: python make_samples.py && python test_sportsedge_nba_model.py
      - name: CFB
        working-directory: models/cfb
        run: python make_samples.py && python test_cfb_model.py
      - name: NHL
        working-directory: models/nhl
        run: python test_sportsedge_nhl.py && python test_nhl_shared_scenarios.py
      - name: CBB
        working-directory: models/cbb
        run: python test_cbb.py && python test_cbb_shared_possessions.py && python -m unittest -v test_torvik_point_in_time_baseline.py
      - name: DFS historical slate coverage preflight
        working-directory: models/nfl_dfs
        run: python -m unittest -v test_historical_coverage_preflight.py
      - name: DFS canonical output integrity (synthetic)
        working-directory: models/nfl_dfs
        run: python -m unittest -v test_verify_canonical_outputs.py
      - name: Research-only phone card renderer
        working-directory: sportsedge/cards
        run: python -m unittest -v test_phone_card.py
      - name: NFL DFS (Showdown and point-in-time replay)
        working-directory: models/nfl_dfs
        run: python test_showdown_mc.py && python test_public_nfl_gamelogs.py && python test_item4.py && python test_weekly_game_inputs.py && python test_markets.py && python test_reconcile_official_roster.py && python test_export_verified_showdown.py
