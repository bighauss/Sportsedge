name: tests
on: [push, pull_request]
jobs:
  models:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax check (stdlib)
        run: python -m compileall -q models sportsedge
      - name: MLB
        working-directory: models/mlb
        run: python make_samples.py && python test_sportsedge_mlb_model.py
      - name: NBA
        working-directory: models/nba
        run: python make_samples.py && python test_sportsedge_nba_model.py
      - name: CFB
        working-directory: models/cfb
        run: python make_samples.py && python test_cfb_model.py
      - name: NHL
        working-directory: models/nhl
        run: python test_sportsedge_nhl.py
      - name: CBB
        working-directory: models/cbb
        run: python test_cbb.py
      - name: NFL DFS (Showdown and point-in-time replay)
        working-directory: models/nfl_dfs
        run: python test_showdown_mc.py && python test_public_nfl_gamelogs.py && python test_item4.py && python test_weekly_game_inputs.py && python test_weekly_roster_ids.py
