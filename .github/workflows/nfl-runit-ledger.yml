name: NFL RUN IT complete ledger tests
on:
  pull_request:
    paths:
      - 'models/nfl/runit_ledger.py'
      - 'models/nfl/prop_skew_v1.py'
      - 'models/nfl/prop_skew_v1_table.json'
      - 'models/nfl/test_prop_skew_v1.py'
      - 'research/prop_variance/**'
      - 'models/nfl/test_runit_ledger.py'
      - 'models/nfl/RUNIT_LEDGER_README.md'
      - '.github/workflows/nfl-runit-ledger.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Complete-denominator ledger fixture checks
        run: python -m unittest discover -s models/nfl -p 'test_runit_ledger.py' -v
      - name: prop-skew-v1 table, shape and opt-in ledger integration
        run: python -m unittest discover -s models/nfl -p 'test_prop_skew_v1.py' -v
      - name: Compile ledger
        run: python -m py_compile models/nfl/runit_ledger.py
