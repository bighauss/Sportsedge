name: seven-sport prospective PIT freeze (synthetic)
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  freeze-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m compileall -q sportsedge/validation/seven_sport_pit_freeze.py
      - run: python -m unittest sportsedge.validation.test_seven_sport_pit_freeze -v
      - run: python -m compileall -q sportsedge/validation/prospective_forecast_receipt.py
      - run: python -m unittest sportsedge.validation.test_prospective_forecast_receipt -v
      - run: python -m compileall -q sportsedge/validation/firecrawl_espn_injury_intake.py
      - run: python -m unittest sportsedge.validation.test_firecrawl_espn_injury_intake -v
      - run: python -m pip install --disable-pip-version-check cryptography==46.0.4
      - run: python -m compileall -q sportsedge/validation/firecrawl_espn_forward_archive.py
      - run: python -m unittest sportsedge.validation.test_firecrawl_espn_forward_archive -v
