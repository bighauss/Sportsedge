name: CBB RUN IT evidence regressions (provider-free)
on:
  pull_request:
    paths:
      - '.github/workflows/cbb-run-it.yml'
      - '.github/workflows/cbb-run-it-evidence-tests.yml'
      - 'tools/test_cbb_run_it_workflow_security.py'
      - 'tools/test_cbb_run_it_ledger_bootstrap.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evidence-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check cryptography==46.0.4 PyYAML==6.0.3
      - name: Execute evidence and ledger continuity checks with synthetic data and blocked network
        run: python -m unittest -v tools.test_cbb_run_it_workflow_security tools.test_cbb_run_it_ledger_bootstrap
