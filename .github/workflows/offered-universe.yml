name: Offered universe research census synthetic
on:
  pull_request:
    paths:
      - 'research/odds/**'
      - '.github/workflows/offered-universe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest research.odds.test_offered_universe_contract -v
