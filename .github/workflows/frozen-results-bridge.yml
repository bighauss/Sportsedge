name: Frozen results bridge (offline)
on:
  push:
    branches: [research/frozen-results-integration-20261122]
  pull_request:
    branches: [research/espn-final-player-evidence-20261121, main]
    paths:
      - '.github/workflows/frozen-results-bridge.yml'
      - 'sportsedge/validation/**'
      - 'docs/governance/changes/pr-442.json'
permissions:
  contents: read
jobs:
  frozen-results-bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run named offline grading tests
        run: |
          git rev-parse HEAD
          python -m unittest -v sportsedge.validation.test_espn_paper_grade_bridge sportsedge.validation.test_espn_final_evidence sportsedge.validation.test_paper_grade_batch
