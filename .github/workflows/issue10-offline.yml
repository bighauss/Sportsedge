name: Issue 10 offline evidence contracts
on:
  pull_request:
    paths:
      - 'sportsedge/odds/**'
      - '.github/workflows/issue10-offline.yml'
  push:
    paths:
      - 'sportsedge/odds/**'
      - '.github/workflows/issue10-offline.yml'
jobs:
  python-contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run synthetic fail-closed evidence contracts
        run: python -m unittest sportsedge.odds.test_issue10_offline -v
