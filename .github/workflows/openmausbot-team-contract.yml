name: OpenMausBot team contract

on:
  pull_request:
    paths:
      - "integrations/openmausbot/**"
      - ".github/workflows/openmausbot-team-contract.yml"
  push:
    branches: ["main"]
    paths:
      - "integrations/openmausbot/**"
      - ".github/workflows/openmausbot-team-contract.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check team contract and safety defaults
        run: python -m unittest discover -s integrations/openmausbot -p 'test_*.py' -v
