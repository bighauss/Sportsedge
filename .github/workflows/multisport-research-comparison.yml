name: Multisport research comparison
on:
  pull_request:
    paths:
      - 'ledger/multisport/**'
      - '.github/workflows/multisport-research-comparison.yml'
permissions:
  contents: read
jobs:
  synthetic-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Run isolated synthetic tests
        run: python3 -m unittest discover -s ledger/multisport/tests -p 'test_*.py' -v
