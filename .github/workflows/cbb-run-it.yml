name: CBB RUN IT (manual, research diagnostic)
on:
  # pull_request runs ONLY the provider-free fixture gate (no secrets, no provider calls), so the
  # PR head can be verified from a pull_request-triggered run. The model run stays dispatch-on-main.
  pull_request:
    paths:
      - 'models/cbb/**'
      - '.github/workflows/cbb-run-it.yml'
  workflow_dispatch:
    inputs:
      totals_order_verified:
        description: 'Board FORMAT verified price_a=over for TOTAL rows (true/false). Default false withholds totals.'
        default: 'false'
      board_path:
        description: Repository board CSV (verified side orientation required)
        default: models/cbb/lines/board_2026-11-21_0914CT_CBB.csv
      board_captured_utc:
        description: Board capture UTC
        default: '2026-11-21T15:14:00Z'
      season:
        description: CBBD season end year
        default: '2027'
permissions:
  contents: read
  actions: read
concurrency:
  group: cbb-run-it
  cancel-in-progress: false
jobs:
  fixture-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/models/cbb
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: CBB RUN IT fixture gate (synthetic, no provider access)
        working-directory: models/cbb
        run: python -m unittest -v test_cbb_run_it test_cbb_run_it_neutral_unknown test_cbb_run_it_parity test_cbb_run_it_replay test_cbb_end_to_end_fixes test_cbbd_paper_card test_cbbd_paper_ledger test_cbbd_native_score_model
  run-it:
    needs: fixture-gate
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/models/cbb
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fixture gate
        working-directory: models/cbb
        run: python -m unittest -v test_cbb_run_it test_cbb_run_it_neutral_unknown test_cbb_end_to_end_fixes test_cbbd_paper_card test_cbbd_paper_ledger test_cbbd_native_score_model
      - name: Install encryption
        run: python -m pip install --disable-pip-version-check cryptography==46.0.4
      - name: Provider-free CBB ledger continuity regressions
        run: python -m unittest -v tools.test_cbb_run_it_ledger_bootstrap
      - name: Preflight before provider requests
        env:
          CBBD_API_KEY: ${{ secrets.CBBD_API_KEY }}
          SPORTSEDGE_ARCHIVE_FERNET_KEY: ${{ secrets.SPORTSEDGE_ARCHIVE_FERNET_KEY }}
          BOARD: ${{ inputs.board_path }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from cryptography.fernet import Fernet
          try:
              Fernet(os.environ['SPORTSEDGE_ARCHIVE_FERNET_KEY'].encode('ascii'))
          except Exception:
              raise SystemExit('BLOCK_ARCHIVE_KEY') from None
          if not os.environ.get('CBBD_API_KEY'):
              raise SystemExit('BLOCK_SOURCE_KEY')
          repo = Path.cwd().resolve()
          board = (repo / os.environ['BOARD']).resolve()
          if not board.is_relative_to(repo) or not board.is_file():
              raise SystemExit('BLOCK_BOARD_PATH')
          PY
      - name: Restore and verify encrypted paper ledger from the previous run
        env:
          GH_TOKEN: ${{ github.token }}
          SPORTSEDGE_ARCHIVE_FERNET_KEY: ${{ secrets.SPORTSEDGE_ARCHIVE_FERNET_KEY }}
        run: |
          set -euo pipefail
          install -d -m 0700 "$RUNNER_TEMP/ledger"
          # Never silently reset an existing chain: the newest artifact is authoritative.
          artifact=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=cbb-run-it-ledger&per_page=1" \
            --jq 'if (.artifacts | length) == 0 then "NONE" else "\(.artifacts[0].id) \(.artifacts[0].expired)" end')
          if [ "$artifact" = "NONE" ]; then
            # A genuine first run can bootstrap. Any earlier successful CBB RUN IT
            # without a retained ledger is a continuity failure, not a fresh slate.
            prior_success=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/cbb-run-it.yml/runs?status=success&per_page=1" --jq '.total_count')
            case "$prior_success" in ''|*[!0-9]*) echo "::error::CBB_LEDGER_HISTORY_UNVERIFIED"; exit 2;; esac
            if [ "$prior_success" -ne 0 ]; then
              echo "::error::CBB_LEDGER_MISSING_AFTER_PRIOR_SUCCESS"; exit 2
            fi
            echo "no prior successful CBB RUN IT: initialize PAPER chain"; exit 0
          fi
          read -r id expired <<< "$artifact"
          case "$id" in ''|*[!0-9]*) echo "::error::CBB_LEDGER_ARTIFACT_ID_INVALID"; exit 2;; esac
          if [ "$expired" != "false" ]; then
            echo "::error::CBB_LEDGER_ARTIFACT_EXPIRED_OR_UNVERIFIED"; exit 2
          fi
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" > "$RUNNER_TEMP/ledger.zip"
          unzip -q "$RUNNER_TEMP/ledger.zip" -d "$RUNNER_TEMP/ledger-enc"
          python - <<'PY'
          import os, pathlib
          from cryptography.fernet import Fernet
          import cbbd_paper_ledger as LG
          t = pathlib.Path(os.environ['RUNNER_TEMP'])
          raw = Fernet(os.environ['SPORTSEDGE_ARCHIVE_FERNET_KEY'].encode('ascii')).decrypt((t / 'ledger-enc' / 'ledger.jsonl.fernet').read_bytes())
          LG.parse_ledger(raw)
          p = t / 'ledger' / 'ledger.jsonl'; p.write_bytes(raw); p.chmod(0o600)
          PY
      - name: Diagnostic model execution with private logs
        id: model
        env:
          CBBD_API_KEY: ${{ secrets.CBBD_API_KEY }}
          BOARD: ${{ inputs.board_path }}
          BOARD_AT: ${{ inputs.board_captured_utc }}
          SEASON: ${{ inputs.season }}
          TOTALS_VERIFIED: ${{ inputs.totals_order_verified }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -m 0700 "$RUNNER_TEMP/evidence"
          cp -- "$BOARD" "$RUNNER_TEMP/evidence/board.csv"
          extra=()
          if [ "$TOTALS_VERIFIED" = "true" ]; then extra+=(--totals-order-verified); fi
          python models/cbb/cbb_run_it.py --board "$BOARD" --board-captured-utc "$BOARD_AT" --season "$SEASON" \
            --run-id "$GITHUB_RUN_ID" ${extra[@]+"${extra[@]}"} \
            --private-dir "$RUNNER_TEMP/evidence/capture" --out "$RUNNER_TEMP/evidence/card" \
            --ledger "$RUNNER_TEMP/ledger/ledger.jsonl" \
            > "$RUNNER_TEMP/evidence/stdout.log" 2> "$RUNNER_TEMP/evidence/stderr.log"
          cp -- "$RUNNER_TEMP/ledger/ledger.jsonl" "$RUNNER_TEMP/evidence/capture/ledger.jsonl"
      - name: Stage sanitized outputs (card + run receipt; counts and codes only)
        id: stage
        if: always() && steps.model.outcome != 'skipped'
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/public"
          rec="$RUNNER_TEMP/evidence/card/run_receipt.json"
          if [ -f "$rec" ]; then
            d=$(python -c "import json,sys;print(json.load(open(sys.argv[1]))['date_ct'])" "$rec")
            cp -- "$rec" "$RUNNER_TEMP/public/run_receipt_$d.json"
            if [ -f "$RUNNER_TEMP/evidence/card/cbb_card.md" ]; then cp -- "$RUNNER_TEMP/evidence/card/cbb_card.md" "$RUNNER_TEMP/public/card_$d.md"; fi
          fi
      - name: Upload sanitized outputs
        if: always() && steps.stage.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: cbb-public-outputs
          path: ${{ runner.temp }}/public
          retention-days: 14
          if-no-files-found: warn
      - name: Complete encrypted evidence or encrypted failure diagnostics
        id: encrypt
        if: always() && steps.model.outcome != 'skipped'
        env:
          SPORTSEDGE_ARCHIVE_FERNET_KEY: ${{ secrets.SPORTSEDGE_ARCHIVE_FERNET_KEY }}
          MODEL_OUTCOME: ${{ steps.model.outcome }}
        run: |
          python - <<'PY'
          import hashlib, io, json, os, pathlib, tarfile, tempfile
          from cryptography.fernet import Fernet
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          src = root / 'evidence'
          entries = sorted(src.rglob('*'))
          if any(p.is_symlink() for p in entries):
              raise SystemExit('BLOCK_EVIDENCE_SYMLINK')
          files = {str(p.relative_to(src)): p.read_bytes() for p in entries if p.is_file()}
          if not files:
              raise SystemExit('BLOCK_EMPTY_EVIDENCE')
          if os.environ['MODEL_OUTCOME'] == 'success':
              for required in ('card/cbb_card.json', 'card/cbb_card.md', 'card/receipts.json', 'board.csv', 'capture/ledger.jsonl'):
                  if not files.get(required):
                      raise SystemExit('BLOCK_REQUIRED_EVIDENCE_MISSING')
              card = json.loads(files['card/cbb_card.json'])
              if card.get('sport') != 'CBB' or not isinstance(card.get('rows'), list):
                  raise SystemExit('BLOCK_CARD_SCHEMA')
              receipts = json.loads(files['card/receipts.json'])
              if not isinstance(receipts, list) or not receipts:
                  raise SystemExit('BLOCK_RECEIPTS_MISSING')
              source_bytes = [b for n, b in files.items() if n.startswith('capture/') or n == 'board.csv']
              digests = {hashlib.sha256(b).hexdigest() for b in source_bytes}
              for receipt in receipts:
                  digest = str(receipt.get('sha256', '')).removeprefix('sha256:')
                  if len(digest) != 64 or digest not in digests:
                      raise SystemExit('BLOCK_RECEIPT_BYTES_MISMATCH')
          manifest = {'status': 'DIAGNOSTIC_ONLY' if os.environ['MODEL_OUTCOME'] == 'success' else 'FAILED_RUN',
                      'wager_eligible': False, 'approved_stake_u': 0,
                      'files': {n: hashlib.sha256(b).hexdigest() for n, b in files.items()}}
          files['bundle-index.json'] = json.dumps(manifest, sort_keys=True).encode()
          bundle = io.BytesIO()
          with tarfile.open(fileobj=bundle, mode='w') as archive:
              for name, data in sorted(files.items()):
                  info = tarfile.TarInfo(name)
                  info.size, info.mode = len(data), 0o600
                  archive.addfile(info, io.BytesIO(data))
          cipher = Fernet(os.environ['SPORTSEDGE_ARCHIVE_FERNET_KEY'].encode('ascii'))
          token = cipher.encrypt(bundle.getvalue())
          if cipher.decrypt(token) != bundle.getvalue():
              raise SystemExit('BLOCK_ENCRYPTION_ROUNDTRIP')
          with tempfile.NamedTemporaryFile(dir=root) as staging:
              os.chmod(staging.name, 0o600)
              staging.write(token)
              staging.flush()
              os.fsync(staging.fileno())
              os.link(staging.name, root / 'cbb-evidence.tar.fernet')
          PY
      - name: Retain encrypted evidence only
        id: evidence
        if: always() && steps.encrypt.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: cbb-research-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cbb-evidence.tar.fernet
          retention-days: 90
          if-no-files-found: error
      - name: Encrypt ledger for the next run
        if: success() && steps.evidence.outcome == 'success'
        env:
          SPORTSEDGE_ARCHIVE_FERNET_KEY: ${{ secrets.SPORTSEDGE_ARCHIVE_FERNET_KEY }}
        run: |
          install -d -m 0700 "$RUNNER_TEMP/ledger-out"
          python -c "import os,pathlib;from cryptography.fernet import Fernet;t=pathlib.Path(os.environ['RUNNER_TEMP']);(t/'ledger-out'/'ledger.jsonl.fernet').write_bytes(Fernet(os.environ['SPORTSEDGE_ARCHIVE_FERNET_KEY'].encode('ascii')).encrypt((t/'ledger'/'ledger.jsonl').read_bytes()))"
      - name: Retain encrypted ledger
        if: success() && steps.evidence.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: cbb-run-it-ledger
          path: ${{ runner.temp }}/ledger-out/ledger.jsonl.fernet
          retention-days: 90
          if-no-files-found: error
      - name: Sanitized diagnostic summary
        if: success() && steps.model.outcome == 'success' && steps.evidence.outcome == 'success'
        run: |
          printf '%s\n' '## CBB diagnostic execution' 'Model command, evidence checks and encrypted upload succeeded.' 'PAPER / 0u. Not wager-eligible. Model calibration is unvalidated.' '' >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/evidence/card/cbb_card.md" >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/evidence/card/cbb_card.md"
      - name: Sanitized block reason (codes only, no bodies or URLs)
        if: always() && steps.model.outcome == 'failure'
        run: |
          grep -oE '^BLOCKED [A-Za-z]+: [A-Z][A-Z0-9_:]{2,80}' "$RUNNER_TEMP/evidence/stderr.log" | head -3 >> "$GITHUB_STEP_SUMMARY" || echo "BLOCKED (reason not a plain code; see encrypted evidence)" >> "$GITHUB_STEP_SUMMARY"
          grep -oE '^BLOCKED [A-Za-z]+: [A-Z][A-Z0-9_:]{2,80}' "$RUNNER_TEMP/evidence/stderr.log" | head -3 || true
      - name: Fail closed on execution or evidence failure
        if: always() && steps.model.outcome != 'skipped' && (steps.model.outcome != 'success' || steps.evidence.outcome != 'success')
        run: |
          echo '::error::CBB_EXECUTION_OR_EVIDENCE_FAILED'
          exit 1
  publish-outputs:
    # Best-effort commit of outputs/cbb/run_receipt_<date>.json and card_<date>.md to main.
    # Separate job so run-it keeps read-only permissions. If branch protection rejects the push, the
    # outputs are still in the cbb-public-outputs artifact.
    needs: run-it
    if: always() && needs.run-it.result != 'skipped' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: cbb-public-outputs
          path: ${{ runner.temp }}/public
      - name: Commit outputs
        run: |
          set -eu
          mkdir -p outputs/cbb
          cp -- "$RUNNER_TEMP"/public/run_receipt_*.json "$RUNNER_TEMP"/public/card_*.md outputs/cbb/ 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add outputs/cbb
          if git diff --cached --quiet; then echo "no new outputs"; exit 0; fi
          git commit -m "CBB RUN IT outputs (PAPER / 0u) run ${GITHUB_RUN_ID}"
          git pull --rebase origin main
          git push origin HEAD:main
