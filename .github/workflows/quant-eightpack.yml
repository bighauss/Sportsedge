name: SportsEdge quantitative evidence research
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  quant-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile research-only companions
        run: python -m compileall -q research/audit
      - name: Run no-network fail-closed regression tests
        run: python -m unittest discover -s research/audit -p 'test_quant_*.py' -v
