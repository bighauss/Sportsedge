name: NBA 2-way period ML push regression
on:
  pull_request:
    paths:
      - 'models/nba/sportsedge_nba_model.py'
      - 'models/nba/test_period_ml_settlement.py'
      - '.github/workflows/nba-period-ml.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  period-ml:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Two-way period moneyline push tests
        working-directory: models/nba
        run: python -m unittest -v test_period_ml_settlement
