name: Moonshot Lab checks
on:
  pull_request:
    paths:
      - 'moonshot/**'
      - '.github/workflows/moonshot-lab.yml'
  push:
    paths:
      - 'moonshot/**'
      - '.github/workflows/moonshot-lab.yml'
jobs:
  offline-rules-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run deterministic NFL Moonshot tests
        run: node moonshot/engine.test.js
