name: User-authorized odds API intake tests (synthetic ONLY)

on:
  pull_request:
    paths:
      - 'sportsedge/odds/free_odds_aggregator_intake.py'
      - 'sportsedge/odds/test_free_odds_aggregator_intake.py'
      - 'sportsedge/odds/the_odds_api_clv_export.py'
      - 'sportsedge/odds/test_the_odds_api_clv_export.py'
      - 'sportsedge/odds/prospective_clv_cycle.py'
      - 'sportsedge/odds/event_discovery.py'
      - 'sportsedge/odds/test_event_discovery.py'
      - 'sportsedge/odds/quota_capture_plan.py'
      - 'sportsedge/odds/test_quota_capture_plan.py'
      - 'sportsedge/odds/test_prospective_clv_cycle.py'
      - 'ledger/historical_clv_bridge.py'
      - '.github/workflows/odds-api-intake-contract.yml'
  push:
    branches: [main]
    paths:
      - 'sportsedge/odds/**'
      - 'ledger/historical_clv_bridge.py'
      - '.github/workflows/odds-api-intake-contract.yml'

permissions:
  contents: read

jobs:
  test-no-secrets-and-no-live-quotes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run synthetic provider identity, key redaction, and no-live-bet tests
        run: python -m unittest sportsedge.odds.test_free_odds_aggregator_intake sportsedge.odds.test_the_odds_api_clv_export sportsedge.odds.test_prospective_clv_cycle sportsedge.odds.test_event_discovery sportsedge.odds.test_quota_capture_plan -v
