name: Private media CLI synthetic
on:
  pull_request:
    paths:
      - 'tools/media/**'
      - '.github/workflows/media-private-cli.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest tools.media.test_private_asset_cli tools.media.test_asset_intake_contract -v
