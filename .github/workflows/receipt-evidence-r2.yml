name: R2 receipt evidence synthetic checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  receipt-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'numpy>=1.24'
      - run: python -m compileall -q research/receipt_integration_r2 research/audit_legacy_20261115 research/half_legacy_20261115 research/props_candidates_20261115
      - name: R1 fail-closed synthetic regressions (72)
        run: |
          cd research/receipt_integration_r2
          PYTHONPATH=repair_r1:repair_r1/tests:repair_r2 python -m unittest discover -s repair_r1/tests -q
      - name: R2 raw receipt synthetic regressions (12)
        run: |
          cd research/receipt_integration_r2
          PYTHONPATH=repair_r1:repair_r1/tests:repair_r2 python -m unittest discover -s repair_r2/tests -q
