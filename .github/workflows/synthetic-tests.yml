name: SportsEdge synthetic regression tests

on:
  push:
    branches: [main, "fix/**", "migration/**"]
  pull_request:

permissions:
  contents: read

jobs:
  synthetic-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile all Python sources
        run: |
          python -m compileall -q engine models sportsedge
      - name: CFB synthetic end-to-end
        run: python models/cfb/test_cfb_model.py
      - name: NBA synthetic end-to-end
        run: python models/nba/test_sportsedge_nba_model.py
      - name: MLB synthetic regression suite
        run: python models/mlb/test_sportsedge_mlb_model.py
      - name: NHL synthetic end-to-end
        run: python models/nhl/test_sportsedge_nhl.py
      - name: CBB synthetic end-to-end
        run: python models/cbb/test_cbb.py
