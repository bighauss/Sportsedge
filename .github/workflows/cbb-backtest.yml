name: CBB backtest reproducibility (offline)
on:
  pull_request:
    paths:
      - 'research/cbb_backtest/**'
      - 'docs/governance/changes/pr-538.json'
      - '.github/workflows/cbb-backtest.yml'
  push:
    branches: [main]
    paths:
      - 'research/cbb_backtest/**'
      - 'docs/governance/changes/pr-538.json'
      - '.github/workflows/cbb-backtest.yml'
  workflow_dispatch:
    inputs:
      fullgame_ref:
        description: 'Optional git ref of the full-game branch (PR #534) to also run the FG1 comparison against; empty = skip FG1'
        required: false
        default: ''
permissions:
  contents: read
jobs:
  backtest-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numpy (only third-party dependency of the offline tests)
        run: python -m pip install numpy
      - name: Verify committed inputs and result evidence against the sha256 manifest (fails on any mismatch)
        run: python -m research.cbb_backtest.inputs verify
      - name: Backtest + reproducibility tests (FG1 skipped cleanly when PR #534 is absent)
        env:
          PYTHONPATH: .:models/cbb
        run: python -m unittest -v research.cbb_backtest.test_cbb_backtest research.cbb_backtest.test_reproducibility

  backtest-tests-with-fg1:
    # Manual only: needs the full-game branch (PR #534) because FG1 is not on main.
    if: github.event_name == 'workflow_dispatch' && inputs.fullgame_ref != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.fullgame_ref }}
          path: fullgame
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy
      - name: Tests with FG1 importable from the full-game checkout
        env:
          PYTHONPATH: .:models/cbb:fullgame
        run: python -m unittest -v research.cbb_backtest.test_cbb_backtest research.cbb_backtest.test_reproducibility
