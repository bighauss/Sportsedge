name: RUN IT v2.1 risk contract tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  v21-risk:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m compileall -q research/risk
      - run: python research/risk/test_v21_risk_contract.py
      - run: python -m unittest research.risk.test_strict_v21_v22 -v
