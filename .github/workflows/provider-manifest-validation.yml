name: Provider observation manifest validator tests
on:
  pull_request:
    paths:
      - 'tools/validate_provider_observation.py'
      - 'tools/test_validate_provider_observation.py'
      - '.github/workflows/provider-manifest-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run adversarial validator tests
        run: python -m unittest tools.test_validate_provider_observation -v
