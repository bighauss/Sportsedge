name: Forward holdout research contract
on:
  pull_request:
    paths:
      - 'research/edge/**'
      - '.github/workflows/edge-forward-holdout.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest research.edge.test_forward_holdout_contract -v
