name: SportsLeader venue baseline
on:
  pull_request:
    paths:
      - 'research/sportsleader/**'
      - '.github/workflows/sportsleader-venue-baseline.yml'
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        league: [cbb, cfb, nfl]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pyarrow==19.0.1
      - run: |
          mkdir -p evidence
          curl --fail --location --max-time 60 --max-filesize 10000000 https://github.com/WalrusQuant/sportsleader-data/releases/download/manifest/manifest.json -o evidence/manifest.json
          for season in 2022 2023 2024 2025; do
            python -m research.sportsleader.run_intake evidence/manifest.json ${{ matrix.league }} games "$season" evidence/assets > "evidence/receipt-$season.json"
          done
          python -m research.sportsleader.venue_baseline evidence/assets/*.parquet | tee evidence/baseline.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: venue-baseline-${{ matrix.league }}
          path: |
            evidence/receipt-*.json
            evidence/baseline.json
          retention-days: 7
